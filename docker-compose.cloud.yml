services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gitlab_dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gitlab_dashboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gitlab_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud-network

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud-network

  app:
    image: ismoilovdevml/gitlab-ci-dashboard:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database & Cache
      DATABASE_URL: postgresql://${POSTGRES_USER:-gitlab_dashboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gitlab_dashboard}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      # App
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.cidash.dev}

      # Cloud Auth Mode
      AUTH_MODE: supabase
      NEXT_PUBLIC_AUTH_MODE: supabase
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}

      # Security
      SESSION_SECRET: ${SESSION_SECRET}
      CLOUD_WEBHOOK_SECRET: ${CLOUD_WEBHOOK_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}

      # Admin (fallback)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cidash.dev}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    networks:
      - cloud-network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        while ! nc -z postgres 5432; do sleep 1; done &&
        echo 'Running migrations...' &&
        npx prisma db push --skip-generate &&
        npx tsx prisma/seed.ts || true &&
        echo 'Starting cloud dashboard...' &&
        node server.js
      "

volumes:
  postgres_data:
  redis_data:

networks:
  cloud-network:
    driver: bridge
