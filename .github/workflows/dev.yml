name: Dev Branch CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
  contents: read

# Cancel in-progress runs for same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  test-and-build:
    name: Test & Build (No Publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    # Generate Prisma Client (must be before type checking)
    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Lint code
      run: npm run lint

    # next build only type-checks files reachable from the app; this also covers
    # test files and prisma/seed.ts.
    - name: Type check
      run: npx tsc --noEmit

    - name: Run tests
      run: npm run test

    # Builds with a canary GitLab token and fails if it reaches the client bundle
    - name: Build and check client bundle
      run: npm run check:bundle
      env:
        NODE_ENV: production

    # Setup Docker Buildx for advanced caching
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Cache Docker layers
    - name: Cache Docker layers
      uses: actions/cache@v6
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Test Docker build
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        tags: gitlab-ci-dashboard:test
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

    # Move cache to prevent it from growing indefinitely
    - name: Move Docker cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    - name: Summary
      run: |
        echo "✅ All checks passed for dev branch!"
        echo "📦 Built successfully"
        echo "🐳 Docker image tested"
        echo "⚠️  Not publishing to Docker Hub (dev branch)"
