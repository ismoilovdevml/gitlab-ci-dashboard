name: Main Branch CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Manual trigger

permissions:
  contents: read

# Cancel in-progress runs for same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  DOCKER_IMAGE: gitlab-ci-dashboard

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    # Generate Prisma Client (must be before type checking)
    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Lint code
      run: npm run lint

    # next build only type-checks files reachable from the app; this also covers
    # test files and prisma/seed.ts.
    - name: Type check
      run: npx tsc --noEmit

    - name: Run tests
      run: npm run test

    # Builds with a canary GitLab token and fails if it reaches the client bundle
    - name: Build and check client bundle
      run: npm run check:bundle
      env:
        NODE_ENV: production

  docker-build:
    name: Docker Build (No Push)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        tags: ${{ env.DOCKER_IMAGE }}:pr-${{ github.event.pull_request.number }}
        cache-from: type=gha

  docker-publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver-opts: |
          image=moby/buildkit:latest
          network=host

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.USER }}
        password: ${{ secrets.PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ secrets.USER }}/${{ env.DOCKER_IMAGE }}
        tags: |
          type=raw,value=latest
          type=sha,prefix=main-,format=short

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1
        provenance: mode=max
        sbom: false

    - name: Summary
      run: |
        echo "✅ Docker image published to Docker Hub!"
        echo "🐳 Image: ${{ secrets.USER }}/${{ env.DOCKER_IMAGE }}"
        echo "🏷️  Tags: ${{ steps.meta.outputs.tags }}"
